<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png">
<title>Brand'Ade Crew — Groove Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060607;--line:#2a2a30;--chrome:linear-gradient(180deg,#fff 0%,#c9ccd3 28%,#6c7079 52%,#e9ebef 70%,#8d919a 100%);--yel:#ffde61;--yel-dim:#4a3d10;--txt:#e8e9ec;--mute:#8a8c93}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Space Mono",ui-monospace,monospace;min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(ellipse at 50% -10%,#3a2f06 0%,transparent 55%),repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}
button,a{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--yel);outline-offset:3px}
.demo{text-align:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:6px 16px;background:#121214;color:var(--mute);border-bottom:1px solid var(--line)}
main{max-width:620px;margin:auto;padding:18px 16px 40px}
header{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.2em;font-weight:700;margin-bottom:14px}
header span{width:9px;height:9px;border-radius:50%;background:var(--yel);box-shadow:0 0 10px var(--yel);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.chrome{background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #000)}
.panel{background:linear-gradient(180deg,#141418,#0b0b0d);border:1px solid #3a3c42;border-radius:18px;position:relative;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.12) inset}
.hero{padding:20px 18px;min-height:150px}
.hero-top{position:relative;font-size:clamp(36px,11vw,80px)}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:1em;line-height:.86;margin:0;text-transform:uppercase}
.hero p{margin:10px 0 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.hero p b{color:var(--yel)}
.fish{width:118px;height:118px}
.logo-chrome{position:absolute;left:75%;top:50%;transform:translate(-50%,-50%);width:1.72em;aspect-ratio:1;border-radius:50%;padding:.055em;
  background:conic-gradient(from 200deg,#fff,#6c7079,#e9ebef,#4a4d54,#c9ccd3,#fff);
  box-shadow:0 .04em 0 #000,0 .12em .25em rgba(0,0,0,.7),0 0 .3em rgba(255,255,255,.06)}
.logo-chrome span{position:relative;display:block;height:100%;border-radius:50%;overflow:hidden;background:var(--chrome)}
.logo-chrome img{display:block;width:100%;height:100%;mix-blend-mode:multiply;filter:contrast(1.15)}
.logo-chrome span:after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  box-shadow:inset 0 .05em .04em rgba(255,255,255,.9),inset 0 -.07em .1em rgba(0,0,0,.55);
  background:linear-gradient(160deg,rgba(255,255,255,.35),transparent 40%)}
.roamer{position:fixed;left:0;top:0;width:84px;height:84px;pointer-events:none;z-index:4;will-change:transform}
.roamer img{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.75));-webkit-user-drag:none;user-select:none}
.bubble{position:fixed;left:0;top:0;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:3;border:1px solid rgba(255,255,255,.55);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),transparent 60%);animation:bubble 1.8s ease-out forwards}
@keyframes bubble{to{transform:translate(var(--bx),-90px) scale(1.4);opacity:0}}
.roamer.charged img{filter:drop-shadow(0 8px 10px rgba(0,0,0,.75)) drop-shadow(0 0 10px rgba(255,255,255,.5))}
.poster{display:block;width:100%;height:auto;margin-top:16px;border-radius:12px;border:1px solid #3a3c42}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.pad{position:relative;min-height:92px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,#1b1b20,#0d0d10);text-align:left;display:grid;align-content:center;gap:6px;font-family:Anton,sans-serif;font-size:24px;line-height:1;text-transform:uppercase;transition:transform .1s,box-shadow .2s,border-color .2s}
.pad .icon{font-family:"Space Mono",monospace;font-size:20px;color:var(--mute)}
.pad:after{content:"";position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%;background:var(--yel-dim)}
.pad[aria-pressed=true]{background:linear-gradient(180deg,#6a6d74,#3a3c42 55%,#2a2b30);border-color:var(--yel);color:#fff;animation:neon-on .5s steps(1) 1,neon 2.4s ease-in-out .5s infinite}
.pad[aria-pressed=true]:after{background:var(--yel);box-shadow:0 0 10px var(--yel);animation:led 1.1s ease-in-out infinite}
.pad[aria-pressed=true] .icon{color:#fff}
.pad.pulse{transform:scale(.965);filter:brightness(1.35) drop-shadow(0 0 10px rgba(255,222,97,.55))}
.pad.tapped{animation:tap .32s ease-out}
.pad:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--hx,50%) var(--hy,50%),rgba(255,255,255,.55),rgba(255,222,97,.25) 30%,transparent 60%)}
.pad.tapped:before{animation:flash .4s ease-out}
@keyframes neon{0%,100%{box-shadow:0 0 0 1px var(--yel),0 0 14px rgba(255,222,97,.35),0 0 18px rgba(255,222,97,.15) inset}50%{box-shadow:0 0 0 1px var(--yel),0 0 26px rgba(255,222,97,.65),0 0 28px rgba(255,222,97,.3) inset}}
@keyframes neon-on{0%,30%,60%{box-shadow:0 0 0 1px var(--yel),0 0 24px rgba(255,222,97,.7)}15%,45%{box-shadow:none;border-color:#3a3c42}}
@keyframes led{50%{opacity:.45;box-shadow:0 0 4px var(--yel)}}
@keyframes tap{30%{transform:scale(.92) translateY(3px)}70%{transform:scale(1.02)}}
@keyframes flash{from{opacity:1}to{opacity:0}}
.hero h1{animation:title 6s infinite}
@keyframes title{0%,92%,100%{filter:drop-shadow(0 2px 0 #000)}93%,95%{filter:drop-shadow(0 2px 0 #000) drop-shadow(0 0 14px rgba(255,222,97,.8))}94%{filter:drop-shadow(0 2px 0 #000)}}
.hero p b{animation:neon-txt 3s infinite}
@keyframes neon-txt{0%,100%{text-shadow:0 0 6px rgba(255,222,97,.8)}48%{text-shadow:0 0 14px var(--yel)}50%{text-shadow:none}52%{text-shadow:0 0 14px var(--yel)}}
.pad:disabled{cursor:default}
.knob-pad{grid-column:1/-1;position:relative;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,#1b1b20,#0d0d10);touch-action:none;cursor:grab;user-select:none}
.knob-pad:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;background:radial-gradient(circle at 40px 50%,rgba(255,255,255,.5),rgba(255,222,97,.25) 25%,transparent 55%)}
.dial.tapped{animation:tap .32s ease-out}
.knob-pad[data-full=true]{border-color:var(--yel);animation:neon 2.4s ease-in-out infinite}
/* bouton touché : capuchon rouge, contour gris */
.knob-pad[data-touched=true] .dial{background:conic-gradient(from -135deg,#c9ccd3 0 var(--sweep),#26272c var(--sweep) 270deg,transparent 270deg)}
.knob-pad[data-touched=true] .dial:before{background:radial-gradient(circle at 35% 30%,#fff4c2,#ffde61 35%,#a9861a 72%,#3a2e05);box-shadow:0 2px 6px #000,0 0 18px rgba(255,222,97,.6)}
.knob-pad[data-touched=true] .dial:after{background:#111}
.dial{--turn:-135deg;--sweep:0deg;flex:none;width:58px;height:58px;border-radius:50%;position:relative;
  background:conic-gradient(from -135deg,var(--yel) 0 var(--sweep),#26272c var(--sweep) 270deg,transparent 270deg)}
.dial:before{content:"";position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9a9ea6 35%,#3d4047 70%,#1a1b1e);box-shadow:0 2px 6px #000}
.dial:after{content:"";position:absolute;left:50%;top:9px;width:3px;height:14px;margin-left:-1.5px;border-radius:2px;background:#111;transform-origin:50% 20px;transform:rotate(var(--turn))}
.knob-copy b{display:block;font-family:Anton,sans-serif;font-weight:400;font-size:22px;text-transform:uppercase}
.knob-copy b small{font-family:"Space Mono",monospace;font-size:12px;color:var(--yel);margin-left:6px}
.knob-copy>small{font-size:11px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.knob-pad input{position:absolute;inset:0;opacity:0;width:100%;height:100%;pointer-events:none}
.progress{margin-top:16px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.08em;text-transform:uppercase;min-height:18px}
.meter{height:4px;background:#1d1d22;border-radius:4px;margin-top:8px;overflow:hidden}
.meter b{display:block;height:100%;width:0;background:linear-gradient(90deg,#8d919a,#fff,var(--yel));transition:width .25s}
.glitch{position:fixed;inset:0;pointer-events:none;z-index:5}
.glitch[data-phase=build]{animation:build 1.75s ease-in forwards;background:repeating-linear-gradient(0deg,rgba(255,222,97,.0) 0 3px,rgba(255,222,97,.08) 3px 4px)}
.glitch[data-phase=hit]{animation:hit .5s ease-out forwards;background:#fff}
@keyframes build{0%{opacity:0}80%{opacity:.6;transform:translateX(0)}85%{transform:translateX(-6px)}90%{transform:translateX(5px)}100%{opacity:1;transform:none}}
@keyframes hit{from{opacity:.85}to{opacity:0}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.invite{margin-top:18px;padding:22px 18px;scroll-margin:12px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.invite[hidden]{display:none}
@keyframes pop{from{transform:scale(.88);opacity:0}}
.kicker{font-size:11px;letter-spacing:.25em;color:var(--yel);text-transform:uppercase}
.invite h2{font-family:Anton,sans-serif;font-weight:400;font-size:clamp(46px,12vw,78px);margin:8px 0 6px;line-height:.9;text-transform:uppercase;outline:none}
.invite .when{font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:0}
.invite .when span{color:var(--mute)}
.player{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#0a0a0c}
.player strong{display:block;font-family:Anton,sans-serif;font-weight:400;font-size:20px;text-transform:uppercase}
.player small{font-size:11px;letter-spacing:.12em;color:var(--mute)}
#listen{width:48px;height:48px;border-radius:50%;border:none;background:radial-gradient(circle at 35% 30%,#fff,#9a9ea6 40%,#3d4047);display:grid;place-items:center;color:#111;font-size:18px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.links a,.links button{min-height:42px;display:inline-flex;align-items:center;padding:8px 14px;border:1px solid #3a3c42;border-radius:10px;background:transparent;text-decoration:none;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.track-status{font-size:11px;letter-spacing:.1em;color:var(--mute);min-height:14px;margin:10px 0 0;text-transform:uppercase}
.replay{margin-top:14px;width:100%;min-height:46px;background:transparent;border:1px solid var(--line);border-radius:12px;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
footer{margin-top:24px;text-align:center;font-size:10px;letter-spacing:.15em;color:#55575e;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="demo">Démo · maquette non officielle</div>
<main>
  <header><span></span>BRAND'ADE CREW</header>

  <section class="panel hero">
    <div>
      <div class="hero-top">
        <h1 class="chrome">Groove<br>Machine</h1>
        <div class="logo-chrome"><span><img src="logo.png" width="360" height="360" alt="Logo Brand'Ade Crew"></span></div>
      </div>
      <p>Tape ton groove pour débloquer <b>le guest</b></p>
    </div>
  </section>

  <section class="pads" id="pads" aria-label="Pads musicaux">
    <div class="knob-pad" id="knob-pad">
      <span class="dial" id="dial" aria-hidden="true"></span>
      <span class="knob-copy"><b>Cut Off <small id="knob-level">0 %</small></b><small id="knob-goal">100 % → guest débloqué</small></span>
      <input id="knob" type="range" min="0" max="100" value="0" step="1" aria-label="Cut Off du synthé" aria-describedby="knob-goal">
    </div>
  </section>
  <div class="progress"><span id="status" role="status">Allume les 4 pads.</span><span id="count">0 / 4</span></div>
  <div class="meter" aria-hidden="true"><b id="meter"></b></div>

  <section class="panel invite" id="invite" hidden aria-labelledby="guest">
    <div class="kicker">✦ Guest débloqué ✦</div>
    <h2 class="chrome" id="guest" tabindex="-1"></h2>
    <p class="when" id="when"></p>
    <div class="player">
      <div><strong id="track"></strong><small id="artist"></small></div>
      <button type="button" id="listen" aria-label="Lire l'extrait">▶</button>
    </div>
    <div class="links">
      <a id="insta" target="_blank" rel="noopener">Instagram ↗</a>
      <a id="spotify" target="_blank" rel="noopener">Spotify ↗</a>
      <button type="button" id="share">Partager</button>
    </div>
    <p class="track-status" id="track-status" role="status"></p>
    <img class="poster" id="poster" src="party-poster.webp" width="920" height="1227" loading="lazy" alt="Affiche de la Brand'Ade Crew Party, dimanche 29 novembre 2026 au Barberousse à Nîmes, de 15 h à 1 h.">
    <button class="replay" type="button" id="replay">↻ Replay</button>
    <audio id="excerpt" preload="none" playsinline></audio>
  </section>

  <footer>Records · FM · Party</footer>
</main>
<div class="glitch" id="glitch" hidden></div>
<canvas class="confetti" id="confetti" hidden aria-hidden="true"></canvas>

<script>
'use strict';
// ====== À CHANGER POUR CHAQUE PROMO ======
const PROMO={
  guest:'Romain Dary',
  date:'Dimanche 29 novembre 2026',
  lieu:'15 h–1 h · Barberousse · Nîmes',
  titre:'Trust Me',
  extrait:'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/8d/bf/96/8dbf965a-40a9-af8f-1e44-6800d4831171/mzaf_447022384980383768.plus.aac.p.m4a',
  instagram:'https://www.instagram.com/romaindarymusic/',
  spotify:'https://open.spotify.com/intl-fr/artist/0GluicI84BMwqFIJanCJBd'
};
// =========================================
const $=id=>document.getElementById(id);
$('guest').textContent=PROMO.guest;
$('when').innerHTML=PROMO.date+'<br><span>'+PROMO.lieu+'</span>';
$('track').textContent=PROMO.titre;$('artist').textContent=PROMO.guest.toUpperCase();
$('insta').href=PROMO.instagram;$('spotify').href=PROMO.spotify;
$('excerpt').src=PROMO.extrait;

const tracks=[
  {name:'Kick',icon:'◉',steps:[0,4,8,12]},
  {name:'Clap',icon:'✺',steps:[4,12]},
  {name:'Hats',icon:'✧',steps:[2,6,10,14]},
  {name:'Synth Bass',icon:'≋',steps:[0,3,6,10,14]}
];
const STEP=60/125/4, EXCERPT=30;
const active=tracks.map(()=>false);
let ctx,master,synth,timer,step=0,next=0,knob=0,revealed=false,dropping=false,spinAt=null;
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- UI ----------
const pads=tracks.map((t,i)=>{
  const b=document.createElement('button');
  b.type='button';b.className='pad';b.setAttribute('aria-pressed','false');
  b.innerHTML='<span class="icon" aria-hidden="true">'+t.icon+'</span>'+t.name;
  b.onclick=()=>{audio();active[i]=!active[i];b.setAttribute('aria-pressed',active[i]);
    if(!active.some(Boolean)){stop();paintKnob(0);}else start();progress();fishTap(b);};
  $('pads').insertBefore(b,$('knob-pad'));return b;
});

function progress(){
  const n=active.filter(Boolean).length;
  $('count').textContent=revealed?'✓':n+' / 4';
  $('meter').style.width=(revealed||dropping?100:n/4*65+knob*.35)+'%';
  $('status').textContent=revealed?'Guest débloqué !':dropping?'':n===0?'Allume les 4 pads.':n<4?'Encore '+(4-n)+' pad'+(4-n>1?'s':'')+' !':knob<100?'Monte le Cut Off à fond.':'';
  fish.classList.toggle('charged',knob>0);
}
function paintKnob(v){
  knob=Math.round(Math.max(0,Math.min(100,v)));
  $('knob').value=knob;$('knob').setAttribute('aria-valuetext',knob+' %');
  $('knob-level').textContent=knob+' %';
  $('knob-pad').dataset.full=knob===100;
  $('knob-pad').dataset.touched=knob>0||!!drag;
  $('dial').style.setProperty('--turn',(-135+2.7*knob)+'deg');
  $('dial').style.setProperty('--sweep',(2.7*knob)+'deg');
  progress();
}
function setKnob(v){
  if(revealed||dropping)return;
  paintKnob(v);audio();shapeSynth();
}
// tourner le bouton : glisser (haut/droite = plus), clic = +25 %, clavier via le range caché
const kp=$('knob-pad');let drag;
kp.addEventListener('pointerdown',e=>{if(e.button||revealed||dropping)return;e.preventDefault();$('knob').focus({preventScroll:true});kp.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,y:e.clientY,v:knob,moved:false};paintKnob(knob);fishTap($('dial'));});
kp.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=drag.y-e.clientY,c=Math.abs(dx)>Math.abs(dy)?dx:dy;if(Math.abs(c)>4)drag.moved=true;if(drag.moved)setKnob(drag.v+c*1.5);});
kp.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;const moved=drag.moved;drag=null;if(!moved)setKnob(knob===100?0:knob+25);else paintKnob(knob);});
kp.addEventListener('pointercancel',()=>{drag=null;paintKnob(knob);});
let lastKeyTap=0;
$('knob').addEventListener('input',e=>{if(!drag&&Date.now()-lastKeyTap>900){lastKeyTap=Date.now();fishTap($('dial'));}setKnob(+e.target.value);});

// ---------- Le poisson se promène dans l'app et vient taper pads / bouton ----------
const fish=document.createElement('div');fish.className='roamer';fish.setAttribute('aria-hidden','true');
fish.innerHTML='<img src="chrome-fish.webp" width="384" height="384" alt="" draggable="false">';document.body.append(fish);
const SZ=84, HEAD=SZ*.3;           // la tête est à ~30 % du centre (image : tête en haut à gauche)
const angDiff=(a,b)=>((b-a)%360+540)%360-180;
const headTo=(dx,dy)=>Math.atan2(dy,dx)*180/Math.PI-225; // rotation pour que la tête pointe dans (dx,dy)
let appr=0,fx=innerWidth*.75,fy=170,vx=-1,vy=0,fr=-45,face=1,goal,tap=null,last=0,nextBubble=0;
// face : 1 = tête à gauche (image normale), -1 = tête à droite (image en miroir) -> jamais à l'envers
function newGoal(){goal={x:SZ/2+Math.random()*Math.max(1,innerWidth-SZ),y:SZ/2+Math.random()*Math.max(1,innerHeight-SZ)};}
newGoal();
function tapFx(el){el.classList.remove('tapped');void el.offsetWidth;el.classList.add('tapped');}
function fishTap(el){if(still){tapFx(el);return;}tap={el,t0:performance.now(),sx:fx,sy:fy,sr:fr,hit:false};}
function bubble(){const b=document.createElement('i');b.className='bubble';const hx=fx-face*SZ*.32,hy=fy-SZ*.12;
  const z=4+Math.random()*6;b.style.width=b.style.height=z+'px';b.style.left=hx+'px';b.style.top=hy+'px';b.style.setProperty('--bx',(Math.random()*24-12)+'px');
  document.body.append(b);setTimeout(()=>b.remove(),1900);}
(function loop(ts){
  const dt=Math.min(50,ts-last||16)/16.67;last=ts;
  const n=active.filter(Boolean).length,playing=!!timer&&n;
  let sc=1,wave=Math.sin(ts/170);
  if(spinAt!==null){                       // montée : il file au centre et tourne
    const k=Math.min(1,(ctx.currentTime-spinAt)/(STEP*8));
    fx+=(innerWidth/2-fx)*.12*dt;fy+=(innerHeight/2-fy)*.12*dt;
    fr=-45*face+720*k*k*(3-2*k);sc=1+k*.9;wave=0;
  }else if(tap){                           // plongeon tête la première sur la cible
    const r=tap.el.getBoundingClientRect(),tx=r.left+r.width/2,ty=r.top+r.height/2-HEAD*.85;
    const p=(ts-tap.t0)/520, dive=-135*face;
    if(p<.6){const k=p/.6,e=k*k;
      fx=tap.sx+(tx-tap.sx)*e;fy=tap.sy+(ty-tap.sy)*e-Math.sin(k*Math.PI)*50;
      fr=tap.sr+angDiff(tap.sr,dive)*Math.min(1,k*1.6);sc=1-.15*k;
    }else{
      if(!tap.hit){tap.hit=true;tapFx(tap.el);for(let i=0;i<3;i++)setTimeout(bubble,i*90);}
      const k=(p-.6)/.4;fx=tx;fy=ty-60*Math.sin(k*Math.PI/2);fr=dive+35*k*face;sc=k<.2?.78:.85+.15*k;
      if(p>=1){tap=null;vx=-face*.5;vy=-1;newGoal();}
    }
    wave*=.3;
  }else{                                   // nage : coups de queue puis glisse, virages doux
    const dx=goal.x-fx,dy=goal.y-fy,d=Math.hypot(dx,dy)||1;
    const kick=.55+.6*Math.max(0,Math.sin(ts/(playing?220:380)));
    const max=(playing?2.4:1.3)*kick;
    vx+=((dx/d)*max-vx)*.025*dt;vy+=((dy/d)*max*.6-vy)*.025*dt;   // freine le vertical : nage à plat
    fx+=vx*dt;fy+=vy*dt+Math.sin(ts/900)*.15;
    if(d<30)newGoal();
    if(vx>.25)face=-1;else if(vx<-.25)face=1;
    const pitch=Math.max(-22,Math.min(22,Math.atan2(vy,Math.abs(vx)+.3)*180/Math.PI));
    const want=face>0?-45-pitch:45+pitch;
    fr+=angDiff(fr,want)*.12*dt;
    if(playing){const ph=ctx.currentTime/(STEP*4)*Math.PI;sc=1+.08*n/4*Math.abs(Math.sin(ph));}
    if(ts>nextBubble){bubble();nextBubble=ts+900+Math.random()*1600;}
  }
  fx=Math.max(SZ*.4,Math.min(innerWidth-SZ*.4,fx));fy=Math.max(SZ*.4,Math.min(innerHeight-SZ*.4,fy));
  // retournement en douceur (largeur qui passe par ~0, comme un vrai demi-tour) + ondulation du corps
  fish.flip=(fish.flip??face)+(face-(fish.flip??face))*.12*dt;
  // Cut Off : plus on tourne, plus il vient vers l'écran (centre, plus gros, tête vers nous, en perspective)
  appr+=(((tap||spinAt!==null||revealed)?0:knob/100)-appr)*.08*dt;
  const a=appr, flipD=fish.flip+(1-fish.flip)*a;
  const sx=(Math.abs(flipD)<.15?.15*Math.sign(flipD||1):flipD)*sc*(1+2*a);
  const px=fx+(innerWidth/2-fx)*a, py=fy+(innerHeight*.45-fy)*a;
  const rot=(fr+wave*5*face)+angDiff(fr+wave*5*face,-45)*a;
  fish.style.transform='translate('+(px-SZ/2)+'px,'+(py-SZ/2)+'px) perspective(320px) rotateY('+(32*a)+'deg) rotateX('+(-10*a)+'deg) rotate('+rot+'deg) scale('+sx+','+sc*(1+2*a)*(1+wave*.03)+') skewY('+(wave*4*(1-a))+'deg)';
  requestAnimationFrame(loop);
})(0);
addEventListener('resize',newGoal);

// ---------- Audio (tout synthétisé) ----------
function audio(){
  if(!ctx){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createDynamicsCompressor();master.threshold.value=-13;master.connect(ctx.destination);
    ctx.noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
    const d=ctx.noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(ctx.state!=='running')ctx.resume();
}
function env(t,peak,dec,dest=master){const g=ctx.createGain();g.gain.setValueAtTime(peak,t);g.gain.exponentialRampToValueAtTime(.001,t+dec);g.connect(dest);return g;}
function noise(t,type,f,peak,dec){const s=ctx.createBufferSource();s.buffer=ctx.noise;const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.value=f;s.connect(fl).connect(env(t,peak,dec));s.start(t);s.stop(t+dec);}
const BASS=[55,55,65.41,49,58.27];
function hit(i,t,s){
  if(i===0){const o=ctx.createOscillator();o.frequency.setValueAtTime(155,t);o.frequency.exponentialRampToValueAtTime(46,t+.11);o.connect(env(t,1,.32));o.start(t);o.stop(t+.33);}
  if(i===1)[0,.012,.024].forEach(d=>noise(t+d,'bandpass',1400,.55,.17));
  if(i===2){const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=7000;hp.connect(env(t,.2,.09));
    [2,3,4.16,5.43,6.79,8.21].forEach(r=>{const o=ctx.createOscillator();o.type='square';o.frequency.value=40*r;o.connect(hp);o.start(t);o.stop(t+.1);});
    noise(t,'highpass',8000,.4,.07);}
  if(i===3){const o=ctx.createOscillator(),f=ctx.createBiquadFilter();o.type='sawtooth';o.frequency.value=BASS[tracks[3].steps.indexOf(s)];
    f.type='lowpass';f.frequency.setValueAtTime(1000,t);f.frequency.exponentialRampToValueAtTime(150,t+.18);o.connect(f).connect(env(t,.32,.22));o.start(t);o.stop(t+.23);}
}
function shapeSynth(){
  if(!ctx)return;
  const t=ctx.currentTime;
  if(!knob){releaseSynth();return;}
  if(!synth){
    const f=ctx.createBiquadFilter();f.type='lowpass';f.Q.value=4;f.frequency.value=125;
    const g=ctx.createGain();g.gain.value=0;f.connect(g).connect(master);
    const osc=[65.41,130.81].map((p,i)=>{const o=ctx.createOscillator();o.type=i?'triangle':'sawtooth';o.frequency.value=p;o.detune.value=i?4:-4;o.connect(f);o.start();return o;});
    synth={f,g,osc};
  }
  const l=knob/100;
  synth.f.frequency.setTargetAtTime(125*Math.pow(19,l),t,.03);
  synth.g.gain.setTargetAtTime(.025+l*.14,t,.03);
}
function releaseSynth(){if(!synth)return;const t=ctx.currentTime;synth.g.gain.setTargetAtTime(0,t,.02);synth.osc.forEach(o=>o.stop(t+.1));synth=null;}

function start(){
  audio();stopExcerpt();
  if(timer||dropping||revealed)return;
  shapeSynth();step=0;next=ctx.currentTime+.04;timer=setInterval(tick,24);tick();
}
function stop(){clearInterval(timer);timer=null;releaseSynth();pads.forEach(p=>p.classList.remove('pulse'));}
function tick(){
  while(next<ctx.currentTime+.09){
    const s=step,t=next;
    const finishing=!revealed&&!dropping&&s%4===0&&knob===100&&active.every(Boolean);
    if(finishing){dropping=true;setTimeout(drop,Math.max(0,(t-ctx.currentTime)*1000));return;}
    const on=tracks.map((tr,i)=>active[i]&&tr.steps.includes(s));
    on.forEach((o,i)=>o&&hit(i,t,s));
    setTimeout(()=>pads.forEach((p,i)=>p.classList.toggle('pulse',on[i])),Math.max(0,(t-ctx.currentTime)*1000));
    step=(step+1)%16;next+=STEP;
  }
}

// ---------- Montée + drop ----------
function glitch(phase,ms){const g=$('glitch');g.dataset.phase=phase;g.hidden=false;clearTimeout(g.t);g.t=setTimeout(()=>{g.hidden=true;},ms);}
function drop(){
  stop();
  pads.forEach(p=>p.disabled=true);$('knob').disabled=true;progress();
  const t=ctx.currentTime,dur=STEP*8;
  // souffle qui monte + double snare
  const s=ctx.createBufferSource();s.buffer=ctx.noise;const f=ctx.createBiquadFilter();f.type='bandpass';f.Q.value=1.5;
  f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(9000,t+dur);
  const g=ctx.createGain();g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.4,t+dur*.95);g.gain.linearRampToValueAtTime(0,t+dur);
  s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+dur);
  [6,7].forEach((k,j)=>{noise(t+STEP*k,'bandpass',1800,.45+j*.1,.11);const o=ctx.createOscillator();o.frequency.value=176;o.connect(env(t+STEP*k,.35,.1));o.start(t+STEP*k);o.stop(t+STEP*k+.1);});
  spinAt=t;glitch('build',dur*1000);
  setTimeout(unlock,dur*1000);
}
function unlock(){
  dropping=false;revealed=true;spinAt=null;
  pads.forEach(p=>p.disabled=false);
  $('invite').hidden=false;progress();celebrate();
  $('guest').focus({preventScroll:true});
  $('invite').scrollIntoView({behavior:still?'auto':'smooth',block:'start'});
  playExcerpt(true);
}

// ---------- Extrait 30 s ----------
const ex=$('excerpt');
function setPlaying(on){$('listen').textContent=on?'❚❚':'▶';$('listen').setAttribute('aria-label',on?'Mettre en pause':"Lire l'extrait");}
function stopExcerpt(){if(!ex.paused)ex.pause();setPlaying(false);}
async function playExcerpt(onDrop){
  try{
    if(ex.currentTime>=EXCERPT-.1)ex.currentTime=0;
    ex.volume=.8;await ex.play();setPlaying(true);
    if(onDrop)glitch('hit',500);
    $('track-status').textContent='';
  }catch{setPlaying(false);$('track-status').textContent='Appuie sur ▶ pour écouter, ou ouvre Spotify.';}
}
$('listen').onclick=()=>ex.paused?playExcerpt():stopExcerpt();
ex.addEventListener('timeupdate',()=>{if(ex.currentTime>=EXCERPT){ex.pause();ex.currentTime=0;}});
ex.addEventListener('pause',()=>setPlaying(false));

// ---------- Confettis chrome ----------
const fishImg=new Image();fishImg.src='chrome-fish.webp';
function celebrate(){
  if(still)return;
  const c=$('confetti');c.hidden=false;
  const W=innerWidth,H=innerHeight,d=Math.min(devicePixelRatio||1,1.5);
  c.width=W*d;c.height=H*d;const g=c.getContext('2d');g.scale(d,d);
  const P=Array.from({length:40},()=>({x:Math.random()*W,st:Math.random()*.6,sp:H*(.25+Math.random()*.2),a:Math.random()*6.3,tu:Math.random()*4-2,sw:14+Math.random()*28,sz:22+Math.random()*22}));
  let t0;
  (function draw(now){
    t0??=now;const e=(now-t0)/1000;g.clearRect(0,0,W,H);
    P.forEach(p=>{const t=e-p.st;if(t<0)return;const y=-14+t*p.sp+H*.11*t*t;if(y>H+15)return;
      const x=p.x+Math.sin(p.a+t*2.6)*p.sw,fl=Math.cos(p.a+t*3.5); // fl : le poisson se retourne en tombant
      g.save();g.translate(x,y);g.rotate(p.a+t*p.tu);g.scale(Math.abs(fl)<.2?.2*Math.sign(fl||1):fl,1);g.drawImage(fishImg,-p.sz/2,-p.sz/2,p.sz,p.sz);g.restore();});
    if(e<3.4)requestAnimationFrame(draw);else c.hidden=true;
  })(performance.now());
}

// ---------- Partage / replay ----------
$('share').onclick=async()=>{
  const url=location.href.split('#')[0];
  try{
    if(navigator.share)await navigator.share({title:"Brand'Ade Crew — Groove Machine",url});
    else{await navigator.clipboard.writeText(url);$('track-status').textContent='Lien copié';}
  }catch(e){if(e.name!=='AbortError')$('track-status').textContent="Copie le lien dans la barre d'adresse.";}
};
$('replay').onclick=()=>{
  stopExcerpt();ex.currentTime=0;stop();
  revealed=false;active.fill(false);
  pads.forEach(p=>{p.disabled=false;p.setAttribute('aria-pressed','false');});
  $('knob').disabled=false;paintKnob(0);
  $('invite').hidden=true;$('track-status').textContent='';
  window.scrollTo({top:0});pads[0].focus({preventScroll:true});
};
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();stopExcerpt();if(!revealed&&!dropping)paintKnob(0);}});
progress();
</script>
